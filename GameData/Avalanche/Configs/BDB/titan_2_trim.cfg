@PART[bluedog_Titan2_S2_VernierMotor]:NEEDS[Waterfall,Bluedog_DB,SmokeScreen]:AFTER[zzzBluedog_DB]
{
	!EFFECTS{}
	!MODULE[ModuleWaterfallFX],* {}
	EFFECTS
	{
		running_solid
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.5
				pitch = 0.0 0.2
				pitch = 1.0 0.8
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 1.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.5
				pitch = 0.8
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.5
				pitch = 0.8
				loop = false
			}
		}
	}
	MODULE
    {
		name = ModuleWaterfallFX
		moduleID = BDB_Titan_2_Trim
		version = FixedRampRates
		ATMOSPHEREDENSITYCONTROLLER
		{
			name = atmosphereDepth
		}
		THROTTLECONTROLLER
		{
			responseRateUp = 2200
			responseRateDown = 2200
			engineID =
			name = throttle
		}
		RANDOMNESSCONTROLLER
		{
			range = 0,0
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 10
			name = Random
			seed = 40
		}
		ENGINEEVENTCONTROLLER
		{
			eventName = flameout
			eventDuration = 20
			name = Burnout
			eventCurve
			{
				key = 0 0 0 0
				key = 0.01 0.01 0 0
				key = 20 1 0 0
			}
		}
		TEMPLATE
		{
			templateName = srb-sm-wf
			overrideParentTransform = thrustTransform
			position = 0,0,0.027
			rotation = 0, 0, 0
			scale = 0.06, 0.06, 0.07
		}
		TEMPLATE
		{
			templateName = srb-sm-burnout
			overrideParentTransform = thrustTransform
			position = 0,0,0.027
			rotation = 0, 0, 0
			scale = 0.06, 0.06, 0.07
		}
	}
}