						scale = 0.82, 0.82, 1
					}
					TEMPLATE
					{
						templateName = srb-l-burnout
						overrideParentTransform = thrustTransform
			            position = 0,-0.157,1.37
						rotation = 6, 0, 0
						scale = 0.82, 0.82, 1
					}
			    }	
		    }
		}
	}
}
