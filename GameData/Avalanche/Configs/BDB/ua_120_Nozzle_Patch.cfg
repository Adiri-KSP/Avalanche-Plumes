@PART[bluedog_UA120*]:NEEDS[Waterfall,Bluedog_DB]:AFTER[zzzBluedog_DB]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchType]]
	{
		@SUBTYPE[Radial]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
				}
				DATA
				{

					TEMPLATE
					{
						templateName = srb-l-wf
						overrideParentTransform = thrustTransform
			            position = 0,-0.157,1.37
